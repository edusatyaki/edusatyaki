name: Refresh profile stats

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/generate_stats.py]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/generate_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit updated cards
        run: |
          git config user.name "Satyaki Das"
          git config user.email "243704326+edusatyaki@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Refresh profile stats"
          git push
